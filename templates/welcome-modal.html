<div style="text-align: center; margin-bottom: 1.5em;">
    <h1 style="font-family: BaseFontBold, FallbackFontBold, sans-serif; font-size: 2.2em; color: rgb(211 211 211); margin: 0 0 0.2em 0; text-transform: uppercase; letter-spacing: 0.5px;">Kaspersky's Inventions</h1>
    <h2 style="font-family: BaseFontMedium, FallbackFontMedium, sans-serif; font-size: 1.1em; color: rgba(255, 255, 255, 0.6); margin: 0; text-transform: uppercase; letter-spacing: 1px;">{{version}}</h2>
</div>

<div style="font-size: 1.05em; line-height: 1.4; color: rgb(220, 220, 220); margin-bottom: 2em; text-align: center;">
    <p style="margin-bottom: 1.5em;">{{intro}}</p>

    <p style="margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 0.9em; text-transform: uppercase;">{{role1}}</p>
    <p style="margin: 0.2em 0 1.5em 0; font-family: BaseFontBold, FallbackFontBold, sans-serif; color: white; font-size: 1.2em;">Kaspersky</p>

    <div style="display: grid; grid-template-columns: 1fr 1fr; text-align: center; max-width: 34em; margin: 0 auto;">

        <div>
            <p style="margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 0.9em; text-transform: uppercase;">{{role2}}</p>
            <p style="margin: 0.2em 0 1.5em 0; color: white; line-height: 1.3;">
                ChatGPT<br>
                DeepSeek<br>
                Claude Sonnet 5<br>
                Claude Haiku 4.5<br>
                Gemini 3.5 Flash-Lite<br>
                Gemini 3.8 Flash<br>
                Gemini 3.1 Pro<br>
                Grok 4.6
            </p>

            <p style="margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 0.9em; text-transform: uppercase;">{{role3}}</p>
            <p style="margin: 0.2em 0 0 0; color: white; line-height: 1.3;">
                Claude Fable 5.1<br>
                Claude Opus 5
            </p>
        </div>

        <div>
            <p style="margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 0.9em; text-transform: uppercase;">{{role4}}</p>
            <p style="margin: 0.2em 0 0 0; color: white; line-height: 1.3;">
                safwan<br>
                Lukas
            </p>
        </div>
    </div>

    <p style="margin: 2em 0 0 0; font-family: BaseFontMedium, FallbackFontMedium, sans-serif; color: rgb(211 211 211); font-size: 1.1em; text-transform: uppercase;">{{outro}}</p>
</div>

<div style="display: flex; justify-content: center; gap: 1em; flex-wrap: wrap;">
    <a href="https://discord.gg/yNeB7Ah752" target="_blank" rel="noreferrer noopener" style="text-decoration: none;">
        <div class="kasp-welcome-btn kasp-welcome-btn--discord">DISCORD</div>
    </a>
    <a href="https://github.com/AlanKaspersky/Kaspersky-Inventions-for-Tanki-Online.git" target="_blank" rel="noreferrer noopener" style="text-decoration: none;">
        <div class="kasp-welcome-btn kasp-welcome-btn--github">GITHUB</div>
    </a>
    <div id="kasp-welcome-close" class="kasp-welcome-btn kasp-welcome-btn--close">{{close}}</div>
</div>
